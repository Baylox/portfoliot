name: CI & Déploiement GitHub Pages

# Le job build tourne aussi sur les PR (Dependabot inclus) : sans lui, une PR
# n'a aucun check et on ne découvre la casse qu'après merge. Seul le push sur
# main déploie.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Groupe par ref : deux PR ne s'annulent pas entre elles ; sur main, un push
# annule toujours la chaîne build+deploy précédente (une seule à la fois).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bloque le déploiement si une vulnérabilité high/critical est connue.
      # Les alertes moderate/low restent visibles sans casser la CI ; Dependabot
      # (.github/dependabot.yml) ouvre les PR de mise à jour chaque semaine.
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      # La CSP autorise le script d'amorçage inline par son hash sha256 : ce
      # garde-fou échoue si le script a changé (retouche, reflow Prettier,
      # checkout CRLF) sans que le hash soit mis à jour. Sans lui, la casse
      # ne se verrait qu'à l'exécution, dans le navigateur.
      - run: npm run csp:check
      - run: npm test -- --watch=false
      - run: npx ng build --base-href /portfoliot/
      # Revérifie la CSP sur l'artefact réellement déployé : le build réécrit
      # index.html et peut y injecter ce que la source ne contient pas (c'est
      # ainsi qu'un onload= généré par inlineCritical a failli partir en prod,
      # où il aurait laissé la page sans feuille de style).
      - run: npm run csp:check:dist
      # SPA fallback : GitHub Pages sert 404.html pour les routes inconnues
      # (/lab en URL directe) — l'app démarre et le Router prend le relais.
      - run: cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
