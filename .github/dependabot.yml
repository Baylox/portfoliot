version: 2
updates:
  # Dépendances npm du portfolio — regroupées pour limiter le bruit de PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          - 'jsdom'
    labels:
      - dependencies
    # Les majeures d'Angular et de TypeScript vont ensemble (Angular impose la
    # plage TS supportée) : elles passent par `ng update` et ses migrations,
    # pas par Dependabot. Les minor/patch continuent d'arriver normalement.
    ignore:
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Actions utilisées par le workflow CI / GitHub Pages.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
